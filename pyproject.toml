[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-iqa"
version = "0.1.0"
description = "No-reference CT image quality assessment on LDCT-IQAC with ResNet50-family models: reference regression, ranking-aware regression and uncertainty-aware regression (builds on the RadImageNet-ResNet50 baseline of Ohashi et al.)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pillow",
    "matplotlib",
    "h5py",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "nbformat",
]

[project.scripts]
ct-iqa = "ct_iqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "pandas>=2.3.3",
]
