[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-aware-lung-ct"
version = "0.1.0"
description = "Quality-aware longitudinal pulmonary nodule growth prediction, built on the NGP-Net baseline"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Runtime dependencies of our code, including the NGP-Net inference path.
# See requirements.txt for per-package provenance and the training-only
# extras deliberately excluded here.
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "SimpleITK>=2.2",
    "scikit-image>=0.21",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Needed only to run scripts/train.py with --lrschedule warmupcosine
# (WarmupCosineSchedule, in training/trainer.py:build_optimizer).
train = ["monai>=1.3"]
dev = ["pytest>=7.4"]
# Needed only to run notebooks/ (matplotlib for visualization, ipykernel to
# run the notebook, nbconvert/nbformat to regenerate notebooks/*.ipynb from
# notebooks/_build_*.py). Nothing under src/ imports these.
notebook = ["matplotlib>=3.8", "ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quality_aware_lung_ct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
