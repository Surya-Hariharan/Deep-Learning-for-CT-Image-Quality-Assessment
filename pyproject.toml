[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-iqa"
version = "0.1.0"
description = "No-reference CT image quality assessment: a RadImageNet-ResNet50 (Ohashi et al.) baseline replication on the LDCT-IQAC dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pillow",
    "matplotlib",
    "h5py",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "nbformat",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
