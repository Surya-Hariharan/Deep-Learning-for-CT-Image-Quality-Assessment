# Training configuration.
#
# PAPER FACT: Adam optimizer, MSE loss, batch size 64, 30 epochs,
# learning rate 1e-3. No scheduler, warmup, weight decay, early stopping,
# augmentation, or mixed precision is added -- see docs/paper/training.md.

seed: 42
batch_size: 64
epochs: 30
learning_rate: 0.001
optimizer: adam
loss: mse
device: cpu

# Experiment-generated checkpoints/config/predictions live under this
# directory (experiments/<NNN_name>/checkpoint/, .../config.yaml, ...) --
# NEVER under weights/, which is reserved for externally-sourced pretrained
# weights only. See docs/decisions/README.md and experiments/001_resnet50_baseline/.
experiment_dir: experiments/001_resnet50_baseline
