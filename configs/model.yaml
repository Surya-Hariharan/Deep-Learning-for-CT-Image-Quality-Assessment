# Model configuration: RadImageNet-pretrained ResNet50 + Ohashi regression head.
#
# PAPER FACT: backbone ResNet50, RadImageNet pretraining, classification head
# replaced by Dropout -> Dense(1) -> Sigmoid. See docs/paper/architecture.md.
#
# IMPLEMENTATION DECISION (not specified by the paper): the exact dropout
# probability, and single-channel-to-3-channel replication for the
# grayscale LDCT-IQAC images. See docs/replication/deviations.md.

architecture: ohashi_resnet50
backbone: resnet50

# LDCT-IQAC images are single-channel float TIFFs; OhashiResNet50 internally
# replicates them to 3 channels before the backbone.
in_channels: 1

# NOT specified by the paper. 0.5 is a common default elsewhere in the
# literature; this is an explicit, documented implementation choice, not a
# paper detail. ct_iqa.config.ExperimentConfig has no built-in default for
# this value -- it must come from here (or be passed explicitly) so every
# run records a deliberate choice.
dropout_p: 0.5

# Path to a converted PyTorch state-dict (see
# src/ct_iqa/models/radimagenet_weights.py).
#
# UPDATED 2026-09-13, after the scientific pipeline audit
# (docs/repository_architecture_audit.md's successor audit): the converted
# checkpoint now exists locally and has been verified to load cleanly --
# 265/318 backbone keys matched, 0 unexpected keys, the remaining 53
# "missing" keys are all non-learned `num_batches_tracked` counters (see
# weights/pretrained/radimagenet/resnet50/README.md, "Provenance and
# verification status"). This path now points at that verified file.
#
# `weights/pretrained/` is gitignored (large binary, not this project's to
# redistribute) -- on a fresh clone without the file, this path will not
# resolve. `OhashiResNet50.load_radimagenet_weights` does NOT catch that:
# `torch.load` raises `FileNotFoundError` loudly, and there is no silent
# fallback to ImageNet weights or to a different local path. If you don't
# have this file, either obtain + convert it (see the README above) or set
# this back to `null` to explicitly run with a random-init backbone.
radimagenet_weights_path: weights/pretrained/radimagenet/resnet50/radimagenet_resnet50_backbone.pt
