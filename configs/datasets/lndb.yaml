# LNDb (Lung Nodule Database, Portugal)
# STATUS: NOT DOWNLOADED. Directory data/raw/lndb is an empty placeholder.

name: lndb
long_name: "LNDb challenge dataset"
role: "external_validation"
role_note: "Held out entirely. Never used for training or hyper-parameter selection."

raw_root: "data/raw/lndb"
present: false

format:
  container: null                 # expected: .mhd/.raw volumes + CSV annotations
  extracted: null

identifiers:
  patient_id: "LNDb-####"
  series_id: "LNDb-#### (one scan per case)"

annotations:
  nodules: "trainNodules.csv"
  segmentation: "masks (per radiologist)"

splits:
  strategy: "external_holdout_only"
