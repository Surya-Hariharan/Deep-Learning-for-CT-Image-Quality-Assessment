# LIDC-IDRI (TCIA)
# STATUS: NOT DOWNLOADED. Directory data/raw/lidc_idri is an empty placeholder.

name: lidc_idri
long_name: "Lung Image Database Consortium and Image Database Resource Initiative"
role: "nodule_detection_segmentation_auxiliary"

raw_root: "data/raw/lidc_idri"
present: false

format:
  container: null                 # expected: DICOM series + per-scan XML annotations
  extracted: null

identifiers:
  patient_id: "LIDC-IDRI-####"
  study_id: "DICOM StudyInstanceUID"
  series_id: "DICOM SeriesInstanceUID"
  slice_index: "DICOM InstanceNumber / ImagePositionPatient[2]"

annotations:
  format: "XML (4 radiologist reads per scan)"
  note: "Consensus rule (e.g. >=3/4 agreement) is a PROJECT DECISION, not yet made."

splits:
  strategy: "patient_level"
  ratios: null
  seed_from: "configs/paths.yaml:random_seed"
