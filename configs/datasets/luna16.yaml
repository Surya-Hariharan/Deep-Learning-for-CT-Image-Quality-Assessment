# LUNA16 (LIDC-IDRI derived detection benchmark)
# STATUS: NOT DOWNLOADED. Directory data/raw/luna16 is an empty placeholder.

name: luna16
long_name: "LUng Nodule Analysis 2016"
role: "detection_benchmark_evaluation"

raw_root: "data/raw/luna16"
present: false

format:
  container: null                 # expected: .mhd/.raw volumes in subset0..subset9
  extracted: null

identifiers:
  patient_id: "seriesuid (LIDC SeriesInstanceUID)"
  series_id: "seriesuid"

annotations:
  candidates: "candidates_V2.csv"
  positives: "annotations.csv"

overlap_warning: >
  LUNA16 is derived from LIDC-IDRI. Using LIDC-IDRI for training and LUNA16 for
  evaluation leaks patients unless the LIDC patient IDs behind each LUNA16
  seriesuid are excluded. scripts/dataset/validate_datasets.py must run a
  cross-dataset patient-overlap check before any detection experiment.

splits:
  strategy: "official_10fold_subsets"
