# Production degradation/generation configuration -- the single authoritative
# source of every parameter `scripts/quality/generate_production_dataset.py`
# uses. No production parameter is hardcoded in the generator; if it isn't
# here, the generator does not know it.
#
# Provenance tags (never mixed within one entry -- taxonomy fixed in
# docs/research_decisions.md):
#   OHASHI-SPECIFIED              - stated in the project brief's summary of the paper
#   REFERENCE-IMPLEMENTATION-CONVENTION - a documented standard this project adopted
#                                    (e.g. scipy's own default kernel/boundary convention)
#   PROJECT ADAPTATION            - our deliberate choice, recorded because Ohashi is silent
#   OBSERVED PILOT BEHAVIOR       - a property measured empirically, not a parameter choice
#
# Every NOT SPECIFIED BY OHASHI item that used to block generation
# (docs/research_decisions.md: U-D01, U-D02) is resolved below as an explicit
# PROJECT ADAPTATION value -- see decisions A-16/A-17. Nothing here is an
# implicit/provisional value: every field either states its source or is
# DERIVED arithmetically from fields that do.
#
# This file does not replace configs/quality/ohashi_ldctiqac.yaml (the
# reference/count/split specification) -- it is the degradation- and
# generation-mechanics config that file's null placeholders now point at.

name: production_degradation_v1
version: "1.0.0"
based_on_pilot: docs/vif_full_grid_pilot_report.md
decision_record: docs/research_decisions.md#production-generation-decision-2026-08-14
seed_from: "configs/paths.yaml:random_seed"

# --- degradation types and grids ---------------------------------------
noise:
  kind: gaussian                    # OHASHI-SPECIFIED
  sigma: [1, 1.5, 2, 3, 4.5, 6, 7.5, 9, 14, 21, 30, 50]   # OHASHI-SPECIFIED, 12 levels
  sigma_units: "8bit_grey_levels"   # PROJECT ADAPTATION -- resolves U-D01, see decision A-17
  sigma_scale: 1.0                  # PROJECT ADAPTATION -- grid value applied directly, no rescaling
  additive: true                    # PROJECT ADAPTATION -- zero-mean additive white Gaussian noise
  clip_after: false                 # PROJECT ADAPTATION -- NOT SPECIFIED BY OHASHI; kept unclipped so
                                     # VIF is computed against the true (not saturation-truncated) signal;
                                     # clipping happens only at PNG-encode time (image_handling below)

blur:
  kind: gaussian                    # OHASHI-SPECIFIED
  sigma: [0.1, 0.15, 0.2, 0.3, 0.45, 0.6, 0.75, 0.9, 1.4, 2.1, 3.0, 5.0]  # OHASHI-SPECIFIED, 12 levels
  sigma_units: pixels               # REFERENCE-IMPLEMENTATION-CONVENTION -- standard Gaussian-blur convention
  truncate: 4.0                     # REFERENCE-IMPLEMENTATION-CONVENTION -- scipy.ndimage.gaussian_filter default
  boundary_mode: nearest            # REFERENCE-IMPLEMENTATION-CONVENTION -- scipy convention; NOT SPECIFIED BY OHASHI

combination:
  enabled: true                     # OHASHI-SPECIFIED
  order: blur_then_noise            # PROJECT ADAPTATION -- resolves U-D02, see decision A-16
  n_combinations: 144                # DERIVED: 12 x 12 full factorial

degradation_types: [clean, noise, blur, noise_blur]   # OHASHI-SPECIFIED family

counts:
  per_reference: {clean: 1, noise_only: 12, blur_only: 12, noise_blur: 144, total: 169}   # DERIVED
  n_references: 1000                 # PROJECT ADAPTATION (LDCT-IQAC replaces Ohashi's 105 references)
  degraded_only_total: 168000        # DERIVED: 1000 x 168 (clean excluded from the degraded count)
  with_clean_total: 169000           # DERIVED: 1000 x 169

# --- randomness / determinism -------------------------------------------
random_seed: "configs/paths.yaml:random_seed"     # single global seed, PROJECT ADAPTATION (A-05)
per_condition_rng: "sha256(seed, reference_id, condition_suffix)"   # PROJECT ADAPTATION (A-06)

# --- image handling -------------------------------------------------------
image_handling:
  input_dtype: float64              # internal computation dtype, full precision throughout
  output_bit_depth: 8               # PROJECT ADAPTATION -- matches LDCT-IQAC source (A-08)
  output_format: png                # PROJECT ADAPTATION -- lossless (A-08)
  output_clip_range: [0, 255]       # applied ONLY when encoding to 8-bit PNG, never before VIF computation
  reference_images_are_read_only: true   # dataset immutability -- see docs/deviations_from_ohashi.md DEV-02

# --- VIF labelling ---------------------------------------------------------
vif:
  variant: vif_wavelet              # PROJECT ADAPTATION -- resolves former U-V01/vif_variant, see decision A-18
  profile: project                  # the ONLY profile ever used for label generation (src/ct_iqa/vif/wavelet.py)
  clean_reference_label: 1.0        # DERIVED (VIF of a reference against itself)
  diagnostic_policy: "flag_retain_never_alter"   # PROJECT ADAPTATION, see decision A-19
  diagnostic_fields_retained: [diagnostic_status, max_channel_gain, covariance_condition_number]
  combined_grid_label_noise: "documented_expected_not_corrected"   # see decision A-20; OBSERVED PILOT BEHAVIOR

# --- output layout ----------------------------------------------------------
output:
  root: "data/processed/quality_iqa"
  references_dir: "references"
  degraded_dirs: {noise: "degraded/noise", blur: "degraded/blur", noise_blur: "degraded/noise_blur"}
  labels_dir: "labels"
  splits_dir: "splits"

# --- checkpointing / resumability -------------------------------------------
checkpoint:
  dir: "data/interim/quality_iqa_checkpoint"   # gitignored (data/interim/**)
  manifest_shard_dir: "data/interim/quality_iqa_checkpoint/manifest_shards"
  progress_manifest: "data/interim/quality_iqa_checkpoint/progress_manifest.json"
  completed_references_log: "data/interim/quality_iqa_checkpoint/completed_references.jsonl"
  checkpoint_every_n_references: 1   # checkpoint after EVERY completed reference, not batched
  flush_metadata_every_n_records: 169  # one reference's worth; also flushed unconditionally per-reference
  atomic_writes: true                # temp-file-then-rename for every checkpoint/manifest-shard write

# --- logging -----------------------------------------------------------------
logging:
  log_dir: "data/interim/quality_iqa_checkpoint/logs"   # gitignored
  log_every_n_references: 1
  log_every_n_seconds: 60

# --- resource projections (from the 100-reference full-grid pilot, OBSERVED PILOT BEHAVIOR) ---
projections:
  source: docs/vif_full_grid_pilot_report.md
  observed_seconds_per_image: 0.424
  projected_runtime_hours: 19.9
  observed_kb_per_image: 163.3
  projected_disk_usage_gb: 28.3
  single_threaded: true
